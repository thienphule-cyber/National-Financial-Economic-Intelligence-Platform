# ---------------------------------------------------------
# General
# ---------------------------------------------------------
spring.application.name=national-financial-intelligence-platform
server.port=8080

# ---------------------------------------------------------
# Static frontend (served from ../frontend when running from backend/)
# The trailing slash is required.
# ---------------------------------------------------------
spring.web.resources.static-locations=file:../frontend/

# ---------------------------------------------------------
# JSON output
# ---------------------------------------------------------
spring.jackson.serialization.indent-output=true
spring.jackson.default-property-inclusion=non_null

# ---------------------------------------------------------
# Local folders (relative to the backend/ directory)
# ---------------------------------------------------------
platform.cache.dir=../cache
platform.results.dir=../results

# ---------------------------------------------------------
# Cache behaviour for public API responses
# ---------------------------------------------------------
platform.cache.ttl-hours=72

# ---------------------------------------------------------
# External data sources (public APIs, no API key required)
# ---------------------------------------------------------
platform.api.worldbank.base-url=https://api.worldbank.org/v2
platform.api.imf.base-url=https://www.imf.org/external/datamapper/api/v1
platform.api.oecd.base-url=https://sdmx.oecd.org/public/rest

# ---------------------------------------------------------
# HTTP client timeouts (milliseconds)
# ---------------------------------------------------------
platform.http.connect-timeout-ms=5000
platform.http.read-timeout-ms=15000

# ---------------------------------------------------------
# Logging
# ---------------------------------------------------------
logging.level.root=INFO
logging.level.com.fintech.platform=DEBUG

# ---------------------------------------------------------
# Development
# ---------------------------------------------------------
spring.devtools.restart.enabled=true